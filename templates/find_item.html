{% extends "layout.html" %}

{% block title %}Etsi ilmoitus{% endblock %}

{% block content %}
<h2>Etsi ravintola</h2>

<form action="/find_item" method="get">
  <p>
    <label for="query">Hakusana:</label>
    <input id="query" type="text" name="query" value="{{ query }}">
  </p>
  <p>
    <label for="location">Sijainti:</label>
    <input id="location" type="text" name="location" value="{{ location }}">
  </p>
  <p>
    <label for="cuisine">Keittiötyyppi:</label>
    <input id="cuisine" type="text" name="cuisine" value="{{ cuisine }}">
  </p>
  <input type="submit" value="Hae">
</form>

{% if results %}
<h3>Tulokset</h3>

<ul>
  {% for item in results %}
  <li><a href="/item/{{ item.id }}">{{ item.name }}</a> {% if item.location %}- {{ item.location }}{% endif %}</li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
